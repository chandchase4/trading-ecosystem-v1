name: Test Node backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: server
      - name: Check JavaScript syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
        working-directory: server
      - name: Run unit and MongoDB integration tests
        run: npm test
        working-directory: server
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/trading_ecosystem_ci
